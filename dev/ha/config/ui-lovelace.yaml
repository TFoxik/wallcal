title: WallCal dev
views:
  - title: Wall
    path: wall
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#7F77DD"
          - entity: calendar.work
            toggle: true
            icon: mdi:briefcase
          - entity: calendar.namedays
            color: "#F4A27A"
            toggle: true
            display: label
            strip_prefix: "Svátek:"
            suffix: CZ
          - entity: calendar.namedays_sk
            color: "#8FB8E8"
            toggle: true
            display: label
            suffix: SK
        refresh_interval: 60
        past_events: dim
        weekday_format: long
        weather:
          entity: weather.home
        moon:
          enabled: true
        period:
          enabled: true
          last_period: 2026-10-04
        overlays:
          - position: bottom-right
            icon: mdi:format-list-checks
            toggle: pill
            name: Shopping
            card:
              type: todo-list
              entity: todo.shopping
              hide_completed: true
          - position: bottom-left
            span: 1
            icon: mdi:weather-partly-cloudy
            visible: true
            card:
              type: tile
              entity: weather.home
  - title: Paper 5 days
    path: paper
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - calendar.family
          - calendar.work
        days: 5
        theme: paper
        time_format: 12
        header:
          title: range
        moon:
          enabled: true
          show_name: true
        overlays:
          - position: bottom-center
            span: 3
            visible: true
            icon: mdi:format-list-checks
            card:
              type: todo-list
              entity: todo.shopping
  - title: Sections
    type: sections
    sections:
      - cards:
          - type: custom:wallcal-card
            entities:
              - calendar.family
            theme: midnight
