title: WallCal dev
views:
  - title: Wall
    path: wall
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#7F77DD"
          - entity: calendar.work
            toggle: true
            icon: mdi:briefcase
          - entity: calendar.namedays
            color: "#F4A27A"
            toggle: true
        refresh_interval: 60
        past_events: dim
        weather:
          entity: weather.home
        moon:
          enabled: true
        period:
          enabled: true
          last_period: 2026-10-04
  - title: Paper 5 days
    path: paper
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - calendar.family
          - calendar.work
        days: 5
        theme: paper
        time_format: 12
        header:
          title: range
        moon:
          enabled: true
          show_name: true
  - title: Sections
    type: sections
    sections:
      - cards:
          - type: custom:wallcal-card
            entities:
              - calendar.family
            theme: midnight
