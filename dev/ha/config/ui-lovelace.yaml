title: WallCal dev
views:
  - title: Wall
    path: wall
    panel: true
    cards:
      - &wall_card
        type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#7F77DD"
          - entity: calendar.work
            toggle: true
            icon: mdi:briefcase
          - entity: calendar.namedays
            color: "#F4A27A"
            toggle: true
            display: label
            strip_prefix: "Svátek:"
            suffix: CZ
          - entity: calendar.namedays_sk
            color: "#8FB8E8"
            toggle: true
            display: label
            suffix: SK
        refresh_interval: 60
        past_events: dim
        weekday_format: long
        weather:
          entity: weather.home
        moon:
          enabled: true
        period:
          enabled: true
          last_period: 2026-10-04  # fictional fixture date
        overlays:
          - position: bottom-right
            icon: mdi:format-list-checks
            toggle: pill
            pill: compact
            name: Shopping
            card:
              type: todo-list
              entity: todo.shopping
              hide_completed: true
          - position: bottom-left
            span: 2
            width: 45%
            icon: mdi:weather-partly-cloudy
            visible: true
            card:
              type: tile
              entity: weather.home
  # Paper and Midnight copies of the Wall card, for the landing page's screenshots.
  - title: Paper week
    path: paper-week
    panel: true
    cards:
      - <<: *wall_card
        theme: paper
  - title: Midnight week
    path: midnight-week
    panel: true
    cards:
      - <<: *wall_card
        theme: midnight
  - title: Paper 5 days
    path: paper
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - calendar.family
          - calendar.work
        days: 5
        theme: paper
        time_format: 12
        header:
          title: range
        moon:
          enabled: true
          show_name: true
        overlays:
          - position: bottom-center
            span: 3
            visible: true
            icon: mdi:format-list-checks
            card:
              type: todo-list
              entity: todo.shopping
  - title: Sections
    type: sections
    sections:
      - cards:
          - type: custom:wallcal-card
            entities:
              - calendar.family
            theme: midnight
  # Recipes from the docs site; docs/recipes/*.md must show exactly these cards (test/docs.test.ts).
  - title: Kitchen
    path: recipe-kitchen
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#7F77DD"
          - entity: calendar.work
            color: "#5DCAA5"
            toggle: true
            icon: mdi:briefcase
        past_events: dim
        header:
          idle_return: 60
        weather:
          entity: weather.home
          show_low: true
        moon:
          enabled: true
        overlays:
          - position: bottom-right
            icon: mdi:format-list-checks
            toggle: pill
            name: Shopping
            card:
              type: todo-list
              entity: todo.shopping
              hide_completed: true
  - title: Bedroom
    path: recipe-bedroom
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#8E87E0"
        days: 5
        theme: midnight
        past_days: grey
        past_events: hide
        header:
          title: range
          navigation: false
        style:
          date_size: 40
          event_size: 18
          time_size: 15
  - title: Family
    path: recipe-family
    panel: true
    cards:
      - type: custom:wallcal-card
        entities:
          - entity: calendar.family
            color: "#7F77DD"
          - entity: calendar.work
            color: "#5DCAA5"
          - entity: calendar.namedays
            color: "#F4A27A"
            display: label
            strip_prefix: "Svátek:"
            suffix: CZ
          - entity: calendar.namedays_sk
            color: "#8FB8E8"
            display: label
            suffix: SK
        weekday_format: long
        weather:
          entity: weather.home
        moon:
          enabled: true
          show_name: true
