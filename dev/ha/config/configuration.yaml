homeassistant:
  name: WallCal dev
  time_zone: Europe/Prague
  auth_providers:
    # DEV ONLY: browsers on this machine skip the login screen. Never copy this to a real
    # instance, and never run it behind a proxy or in a container: there every client can
    # appear as 127.0.0.1 and gets in without a password.
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
      allow_bypass_login: true
    - type: homeassistant

http:
  # Loopback only, IPv4 and IPv6: browsers try ::1 first for localhost.
  server_host:
    - 127.0.0.1
    - "::1"
  server_port: 8124

frontend:
api:
config:
logger:
  default: warning

lovelace:
  mode: yaml
  resources:
    - url: /local/wallcal-card.js
      type: module
  # Overview (ui-lovelace.yaml) is the wall tablet; these two sit under it in the sidebar.
  dashboards:
    wallcal-phone:
      mode: yaml
      title: Phone
      icon: mdi:cellphone
      filename: dashboards/phone.yaml
    wallcal-recipes:
      mode: yaml
      title: Docs recipes
      icon: mdi:book-open-variant
      filename: dashboards/recipes.yaml

calendar:
  - platform: wallcal_fixture

todo:
  - platform: wallcal_fixture

# The cycle helpers for the Cycle helpers view; the date matches the Wall card's fictional one.
input_datetime:
  last_period:
    name: Last period
    has_date: true
    has_time: false
    initial: "2026-10-04"

input_number:
  cycle_length:
    name: Cycle length
    min: 20
    max: 45
    step: 1
    initial: 28
    mode: box
    unit_of_measurement: days
  period_length:
    name: Period length
    min: 1
    max: 10
    step: 1
    initial: 5
    mode: box
    unit_of_measurement: days

template:
  - weather:
      - name: Home
        unique_id: wallcal_dev_weather
        condition: "partlycloudy"
        temperature: "{{ 16 }}"
        humidity: "{{ 60 }}"
        forecast_daily: >
          {% set conditions = ['sunny', 'partlycloudy', 'rainy', 'cloudy', 'pouring', 'lightning-rainy', 'fog'] %}
          {% set ns = namespace(days=[]) %}
          {% for i in range(-1, 9) %}
            {% set ns.days = ns.days + [{
              'datetime': (today_at() + timedelta(days=i)).isoformat(),
              'condition': conditions[i % 7],
              'temperature': 18 - i,
              'templow': 8 - i % 4,
            }] %}
          {% endfor %}
          {{ ns.days }}
