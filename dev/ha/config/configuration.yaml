homeassistant:
  name: WallCal dev
  time_zone: Europe/Prague
  auth_providers:
    # Local-only dev instance: browsers on this machine skip the login screen.
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
      allow_bypass_login: true
    - type: homeassistant

http:
  server_port: 8124

frontend:
api:
config:
logger:
  default: warning

lovelace:
  mode: yaml
  resources:
    - url: /local/wallcal-card.js
      type: module

calendar:
  - platform: wallcal_fixture

weather:
  - platform: template
    name: Home
    condition_template: "partlycloudy"
    temperature_template: "{{ 16 }}"
    humidity_template: "{{ 60 }}"
    forecast_daily_template: >
      {% set conditions = ['sunny', 'partlycloudy', 'rainy', 'cloudy', 'pouring', 'lightning-rainy', 'fog'] %}
      {% set ns = namespace(days=[]) %}
      {% for i in range(-1, 9) %}
        {% set ns.days = ns.days + [{
          'datetime': (today_at() + timedelta(days=i)).isoformat(),
          'condition': conditions[i % 7],
          'temperature': 18 - i,
          'templow': 8 - i % 4,
        }] %}
      {% endfor %}
      {{ ns.days }}
