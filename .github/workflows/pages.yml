name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Installs and builds without the deploy token, so package install scripts never see it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Assemble the landing page and the docs
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R docs/.vitepress/dist _site/docs
          cp _site/docs/404.html _site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
